<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeGrid</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="public/favicon.png">
</head>
<body>
    <div class="hero flex">
        <p class="">Enter your date of birth to see your life in weeks!</p>
        <form>
            <label for="dob">Date of Birth:</label>
            <input value="2009-02-11" required type="date" id="dob" placeholder="Date of Birth">
            <button onclick="getdob()" type="button" id="btn">Submit</button>
        </form>
        <p id="text">Hola</p>
        <div class="year-sec flex" id="year-sec">
            <div class="circle flex" id="circle"><p class="innertext"></p></div>
        </div>
        <p id="noteOne"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
