<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeGrid</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="public/favicon.png">
</head>

<body>

    <section class="hero">
        

        <div class="nav">
            <img class="logo" src="public/favicon.png">
            <div class="title">LifeGrid</div>
            <div class=""></div>
            <div class="page active">Home</div>
            <div class="page">About</div>
            <div class="page">Contact</div>
        </div>


        <video loop autoplay muted class="bg-video" poster="public/bg1.png">
            <source src="public/cloud.mp4">
        </video>
        <div class="bg"></div>


        <div class="head">
            <h1 class="head1" id="head1">Time, Made Visible.</h1>

            <p class="para1">Transform your age into an interactive grid of years, months, weeks, and days.</p>

            <p class="para2">Enter your date of birth to see your life in weeks!</p>
            <form>
                <input value="2009-02-11" required type="date" id="dob" placeholder="Date of Birth">
                <a href="#y-sec">
                    <button onclick="getdob()" type="button" id="btn">Let's Go</button>
                </a>
            </form>

        </div>


    </section>



    <section class="y-sec" id="y-sec">


            <p id="text">Hola</p>
            <div class="year-sec flex" id="year-sec">
                <div class="circle flex" id="circle">
                    <p class="innertext"></p>
                </div>
            </div>
            <p id="noteOne"></p>


    </section>

    <script src="script.js"></script>
</body>

</html>
